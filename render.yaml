# Render Blueprint — ABB Bailey INFI 90 Migration Studio
# Mirrors the live service: the Next.js app (UI + migration API) built from the
# root Dockerfile. Runtime env vars (STORAGE_ROOT, CORS_ORIGINS, CAD_LIBRARY_ROOT, …)
# are set in the Dockerfile.
# Account: valmet.intern@gmail.com
#
# Storage: the free plan has no persistent disk, so /data (sessions, uploads,
# artifacts) is lost on every restart or deploy. For persistent sessions use a
# paid plan and add:
#   disk:
#     name: infi90-data
#     mountPath: /data
#     sizeGB: 10

services:
  - type: web
    name: infi90-migration-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
